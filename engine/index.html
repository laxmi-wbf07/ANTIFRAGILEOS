<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Engine</title>

<meta name="description" content="Flash cards, a deep work timer and water, kept on your own phone.">
<meta name="theme-color" content="#0D1014">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Engine">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">

<script>
  /* Set the theme before first paint so the screen never flashes white at 6am. */
  (function () {
    try {
      var raw = localStorage.getItem('engine.doc.v1');
      var t = 'dark';
      if (raw) {
        var s = JSON.parse(raw).settings || {};
        t = s.theme || 'dark';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.accent = s.accent || 'default';
        document.documentElement.dataset.density = s.density || 'normal';
      }
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', t === 'light' ? '#F6F2EA' : '#0D1014');
    } catch (e) {}
  })();
</script>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="topbar-in">
      <div class="grow">
        <div class="topbar-title">Engine</div>
        <div class="topbar-sub">Starting up</div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="block" aria-hidden="true">
      <div class="skel" style="height:22px;width:52%"></div>
      <div class="skel" style="height:15px;width:34%;margin-top:10px"></div>
      <div class="skel" style="height:110px;margin-top:22px;border-radius:18px"></div>
      <div class="skel" style="height:62px;margin-top:12px;border-radius:12px"></div>
    </div>
    <noscript>
      <div class="empty">
        <b>JavaScript is switched off</b>
        Engine runs entirely in the browser with no server, so it needs JavaScript to do anything at all.
      </div>
    </noscript>
  </main>

  <nav id="tabbar" aria-label="Sections"></nav>
</div>

<div id="reel" hidden></div>
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="updater" hidden></div>

<script type="module" src="js/app.js"></script>

<script>
  /* The service worker is registered here, in a plain script, rather than
     from inside the module graph.

     If a module ever fails to load — a half-finished upload, a file
     missing from the cache, a typo in an import — the graph never
     instantiates and nothing inside it runs, which would include the code
     that registers the worker. The app would then be stuck on the broken
     copy with no way to fetch a fixed one. Registering out here means an
     update can always land, so a bad build can be replaced by the next
     one instead of bricking the page.

     It also races the module fetches for bandwidth and loses on a bad
     connection, so it waits for load and then retries. app.js picks the
     registration up through navigator.serviceWorker.ready. */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var tries = 0;
    function go() {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {
        if (++tries < 4) setTimeout(go, 900 * tries);
      });
    }
    if (document.readyState === 'complete') setTimeout(go, 300);
    else addEventListener('load', function () { setTimeout(go, 300); });
  })();
</script>
</body>
</html>
